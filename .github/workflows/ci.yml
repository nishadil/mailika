name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, dom, filter, json, mbstring, openssl, pdo, sodium
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer audit
      - run: composer check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t ghcr.io/nishadil/mailika:ci .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/nishadil/mailika:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
