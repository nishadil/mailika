protocols = imap sieve
listen = *
base_dir = /run/dovecot

disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/var/mail/mailboxes/%u/Maildir

ssl = no
log_path = /dev/stderr
info_log_path = /dev/stdout

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/mailboxes/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

protocol sieve {
  managesieve_max_line_length = 65536
}

plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
}
