name: Bug report
description: Report a reproducible Mailika defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Provide precise steps and expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or Commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, web server, database, browser, and deployment type.
    validations:
      required: true
